name: RemoteMatch CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: remotematch_test
          POSTGRES_USER: remotematch
          POSTGRES_PASSWORD: remotematch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remotematch -d remotematch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DEBUG: false
      DATABASE_URL: postgresql+psycopg://remotematch:remotematch_test@localhost:5432/remotematch_test
      SESSION_SECRET: test-session-key-with-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check for missing migrations
        run: python -m alembic check

      - name: Check code
        run: python -m ruff check app tests alembic

      - name: Check formatting
        run: python -m ruff format --check app tests alembic

      - name: Run tests
        run: python -m pytest -v

      - name: Run SAST scan
        run: python -m bandit -r app -c pyproject.toml

      - name: Audit installed dependencies
        run: python -m pip_audit --local

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check frontend code
        run: npm run lint

      - name: Check frontend types
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false