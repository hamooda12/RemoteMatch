name: RemoteMatch Daily Jobicy Sync

on:
  schedule:
    # GitHub Actions cron uses UTC.
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotematch-daily-jobicy-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize Jobicy jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENVIRONMENT: production
      DEBUG: false
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.PRODUCTION_SESSION_SECRET }}
      CORS_ORIGINS: https://sync.remotematch.invalid
      ALLOWED_HOSTS: sync.remotematch.invalid
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check synchronization configuration
        id: configuration
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" || -z "${SESSION_SECRET}" ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Jobicy synchronization skipped because production secrets are not configured."
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        if: steps.configuration.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synchronize Jobicy jobs
        if: steps.configuration.outputs.ready == 'true'
        run: |
          python -m app.cli.sync_jobs \
            --source jobicy \
            --max-pages 1